<!doctype html>
<title>SerialBox Console</title>
<style>
    * {
        outline: none;
        user-select: none;
    }
    body, ::selection {
        background-color: black;
        color: lightgray;
        font: 13.3333px Arial;
    }

    div#settingsEl {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 50px;

        border: none;
        border-bottom: 1px solid lightgray;
        background-color: black;
        color: lightgray;
        scrollbar-color: darkgray black;
        overflow-y: scroll;
    }
    div#outputEl {
        position: absolute;
        left: 0;
        top: 51px;
        width: 100%;
        height: calc(100% - 74px);
        margin: 0;
        padding: 0;

        border: none;
        background-color: black;
        color: lightgray;
        scrollbar-color: darkgray black;
        word-wrap: break-word;
        overflow-y: scroll;
        font-family: monospace;
    }
    input#inputEl {
        position: absolute;
        left: 0;
        top: calc(100% - 23px);
        width: calc(100% - 4px);
        height: 20px;
        margin: 0;
        padding: 1px 2px;

        border: none;
        border-top: 1px solid darkgray;
        background-color: black;
        color: lightgray;
    }
    input#inputEl::selection, div#outputEl *::selection, span#infoEl::selection, span#usbVIdEl::selection, span#usbPIdEl::selection, span#btSvClIdEl::selection {
        background-color: lightgray;
        color: black;
    }

    button, input, select {
        background-color: lightgray;
        border-radius: 5px;
    }
    button[disabled], input[disabled], select[disabled] {
        background-color: darkgray;
    }
    button {
        height: 25px;
    }
    button:not([disabled]), select:not([disabled]) {
        cursor: pointer;
    }
    i {
        color: darkgray;
    }
    a {
        color: lightgray;
        text-decoration: none;
    }

    span#infoEl {
        border-radius: 5px;
        padding: 2px;
        height: 25px;
        
        border: 1px solid lightgray;
    }
    div#outputEl *, span#infoEl, span#usbVIdEl, span#usbPIdEl, span#btSvClIdEl {
        user-select: text;
    }
    span#usbVIdEl, span#usbPIdEl, span#btSvClIdEl, span#readSignalEl {
        color: darkgray;
    }
    input#signalEl {
        width: 50px;
        border: 1px dashed black;
    }
    input#baudRateEl {
        width: 70px;
    }
    input#inputEl[disabled] {
        color: gray;
    }
</style>

<div id="settingsEl">
    <button id="connectBtn" autofocus>Connect</button>
    <span id="infoEl">USB: VendorId=<span id="usbVIdEl">&lt;None&gt;</span>, ProductId=<span id="usbPIdEl">&lt;None&gt;</span>. BT: ServiceClassId=<span id="btSvClIdEl">&lt;None&gt;</span></span>
    <button id="clearBtn">Clear output</button>
    | <button id="signalBtn" disabled>Send signals for <input type="number" id="signalEl" value="250" disabled>ms: <input type="checkbox" id="dtrSigEl" disabled><label for="dtrSigEl">DTR</label><input type="checkbox" id="rtsSigEl" disabled><label for="rtsSigEl">RTS</label><input type="checkbox" id="brkSigEl" disabled><label for="brkSigEl">BRK</label></button>
    Signals (<button id="readSignalBtn" disabled>Read</button>): <span id="readSignalEl">&lt;None&gt;</span>
    <br>

    <label for="baudRateEl">Baud rate:</label><input type="number" id="baudRateEl" value="115200" placeholder="115200">
    <label for="dataBitsEl">Data bits:</label><select id="dataBitsEl">
        <option value="7">7</option>
        <option value="8" selected>8</option>
    </select>
    <label for="flowControlEl">Flow control:</label><select id="flowControlEl">
        <option value="none" selected>None</option>
        <option value="hardware">Hardware</option>
    </select>
    <label for="parityEl">Parity:</label><select id="parityEl">
        <option value="none" selected>None</option>
        <option value="even">Even</option>
        <option value="odd">Odd</option>
    </select>
    <label for="stopBitsEl">Stop bits:</label><select id="stopBitsEl">
        <option value="1" selected>1</option>
        <option value="2">2</option>
    </select>
    | <label for="lineEndingEl">Line ending:</label><select id="lineEndingEl">
        <option value="" selected>None</option>
        <option value="\r">CR</option>
        <option value="\n">LF</option>
        <option value="\r\n">CRLF</option>
    </select>
    <label for="autoscrollEl">Autoscroll:</label><input type="checkbox" id="autoscrollEl" checked>
    | SerialBox Console v2.8G <i><a href="https://github.com/moonlightfox3/serialbox" target="_blank">(GitHub repo here)</a></i>
</div>
<div id="outputEl"></div>
<input id="inputEl" placeholder="Type a message here and click Enter to send..." disabled>

<script>
    async function connectSerial (onread = text => {}, ondisconnect = () => {}, baudRate = 115200, dataBits = 8, flowControl = "none", parity = "none", stopBits = 1) {
        let port = null
        try { port = await navigator.serial.requestPort() }
        catch (er) { return undefined }
        try { await port.open({baudRate, bufferSize: 255, dataBits, flowControl, parity, stopBits}) }
        catch (er) { return null }
       
        let reader = port.readable.getReader()
        let writer = port.writable.getWriter()

        let comm = {
            data: {
                port,
                reader, writer,
                readDecoder: new TextDecoder(), writeEncoder: new TextEncoder(),
                readListenerLoop: null,
                hasDisconnected: false,
            },

            getInfo: function () {
                let info = comm.data.port.getInfo()
                return {usbVendorId: info.usbVendorId, usbProductId: info.usbProductId, btServiceClassId: info.bluetoothServiceClassId}
            },
            disconnect: async function () {
                if (!comm.data.hasDisconnected) {
                    comm.data.hasDisconnected = true

                    comm.data.reader.cancel()
                    comm.data.reader.releaseLock()
                    comm.data.writer.releaseLock()

                    await comm.data.port.forget()
                    ondisconnect()
                }
            },
            write: async function (text) {
                let arr = comm.data.writeEncoder.encode(`${text}`)
                await comm.data.writer.write(arr)
            },

            getSignals: async function () {
                let obj = {}
                let rawObj = await comm.data.port.getSignals()
                if (rawObj.clearToSend != null) obj.cts = rawObj.clearToSend
                if (rawObj.dataCarrierDetect != null) obj.dcd = rawObj.dataCarrierDetect
                if (rawObj.dataSetReady != null) obj.dsr = rawObj.dataSetReady
                if (rawObj.ringIndicator != null) obj.ri = rawObj.ringIndicator
                return obj
            },
            setSignals: async function (obj) {
                let rawObj = {}
                if (obj.dtr != null) rawObj.dataTerminalReady = obj.dtr
                if (obj.rts != null) rawObj.requestToSend = obj.rts
                if (obj.brk != null) rawObj.break = obj.brk
                await comm.data.port.setSignals(rawObj)
            },
        }
        port.ondisconnect = async () => await comm.disconnect()
        
        comm.data.readListenerLoop = (async function () {
            while (!comm.data.hasDisconnected) {
                let {value, done} = await comm.data.reader.read()
                if (!done) onread(comm.data.readDecoder.decode(value))
                else break
            }
        })()
        return comm
    }

    let comm = null
    connectBtn.onclick = async function () {
        if (comm == null) {
            comm = await connectSerial(onread, ondisconnect, +baudRateEl.value, +dataBitsEl.value, flowControlEl.value, parityEl.value, +stopBitsEl.value)

            if (comm === undefined) log("<Error connecting to device. No serial port was selected, or the use of serial ports is disabled for this webpage>")
            else if (comm === null) log("<Error connecting to device. The serial port is busy, and already in use by another program>")
            else {
                connectBtn.innerText = "Disconnect"
                baudRateEl.disabled = dataBitsEl.disabled = flowControlEl.disabled = parityEl.disabled = stopBitsEl.disabled = true
                inputEl.disabled = signalBtn.disabled = signalEl.disabled = dtrSigEl.disabled = rtsSigEl.disabled = brkSigEl.disabled = readSignalBtn.disabled = false

                let info = comm.getInfo()
                usbVIdEl.innerText = info.usbVendorId == null ? "<None>" : `0x${info.usbVendorId.toString(16)}`; usbVIdEl.style.color = info.usbVendorId == null ? "darkgray" : "lightgray"
                usbPIdEl.innerText = info.usbProductId == null ? "<None>" : `0x${info.usbProductId.toString(16)}`; usbPIdEl.style.color = info.usbProductId == null ? "darkgray" : "lightgray"
                btSvClIdEl.innerText = (typeof info.btServiceClassId == "number" ? `0x${info.btServiceClassId.toString(16)}` : info.btServiceClassId) ?? "<None>"; btSvClIdEl.style.color = info.btServiceClassId == null ? "darkgray" : "lightgray"
                log("<Device connected>")
            }
        } else await comm.disconnect()
    }
    onbeforeunload = function () {
        if (comm != null) {
            log("<Disconnecting device quickly due to exit>")
            comm.disconnect()
        }
    }

    signalBtn.onclick = async function () {
        let signalsName = []
        if (dtrSigEl.checked) signalsName.push("DTR")
        if (rtsSigEl.checked) signalsName.push("RTS")
        if (brkSigEl.checked) signalsName.push("BRK")
        log(`<Sending ${+signalEl.value}ms signal${signalsName.length != 1 ? "s" : ""}: ${signalsName.join(", ")}>`)

        signalBtn.disabled = signalEl.disabled = dtrSigEl.disabled = rtsSigEl.disabled = brkSigEl.disabled = true
        await comm.setSignals({dtr: dtrSigEl.checked, rts: rtsSigEl.checked, brk: brkSigEl.checked})
        await new Promise(resolve => setTimeout(resolve, +signalEl.value))
        await comm.setSignals({dtr: false, rts: false, brk: false})
        if (comm != null) signalBtn.disabled = signalEl.disabled = dtrSigEl.disabled = rtsSigEl.disabled = brkSigEl.disabled = false

        log(`<Finished sending signal${signalsName.length != 1 ? "s" : ""}>`)
    }
    for (let child of signalBtn.children) child.onclick = ev => ev.stopPropagation()
    signalEl.onkeydown = async function (ev) {
        if (ev.key == "Enter") {
            signalEl.blur()
            await signalBtn.click()
        }
    }
    readSignalBtn.onclick = async function () {
        let signalNames = []
        let signals = await comm.getSignals()
        if (signals.cts) signalNames.push("CTS")
        if (signals.dcd) signalNames.push("DCD")
        if (signals.dsr) signalNames.push("DSR")
        if (signals.ri) signalNames.push("RI")

        readSignalEl.innerText = signalNames.length == 0 ? "<None>" : signalNames.join(", ")
        readSignalEl.style.color = signalNames.length == 0 ? "darkgray" : "lightgray"
    }
    clearBtn.onclick = function () {
        outputEl.innerHTML = ""
    }

    let sentText = [""]
    let sentTextPos = 0
    inputEl.onkeydown = async function (ev) {
        if (ev.key == "Enter") {
            let endingName = lineEndingEl.value.replaceAll("\\r", "CR").replaceAll("\\n", "LF")
            if (endingName == "") endingName = "no"
            log(`<Sending text with ${endingName} line ending: ${inputEl.value}>`)

            let ending = lineEndingEl.value.replaceAll("\\r", "\r").replaceAll("\\n", "\n")
            await comm.write(inputEl.value + ending)
            
            sentText[sentText.length - 1] = inputEl.value
            inputEl.value = ""
            if (sentText.length >= 2 && sentText[sentText.length - 2] == sentText[sentText.length - 1]) sentText[sentText.length - 1] = ""
            else sentText.push("")
            sentTextPos = sentText.length - 1
        } else if (ev.key == "ArrowUp" && !ev.shiftKey && !ev.ctrlKey) {
            if (sentTextPos > 0) {
                ev.preventDefault()

                sentTextPos--
                inputEl.value = sentText[sentTextPos]
            }
        } else if (ev.key == "ArrowDown" && !ev.shiftKey && !ev.ctrlKey) {
            if (sentTextPos < sentText.length - 1) {
                ev.preventDefault()
                
                sentTextPos++
                inputEl.value = sentText[sentTextPos]
            }
        } else setTimeout(function () {
            if (sentText[sentTextPos] != inputEl.value) {
                sentText[sentText.length - 1] = inputEl.value
                sentTextPos = sentText.length - 1
            }
        }, 20)
    }
    onkeydown = function (ev) {
        if (ev.key == "Tab") {
            ev.preventDefault()
            if (document.activeElement == inputEl) {
                let origStart = inputEl.selectionStart
                inputEl.value = inputEl.value.substring(0, inputEl.selectionStart) + "\t" + inputEl.value.substring(inputEl.selectionEnd)
                inputEl.selectionStart = inputEl.selectionEnd = origStart + 1
            } else {
                if (comm == null) connectBtn.focus()
                else inputEl.focus()
            }
        }
    }

    function onread (text) {
        log(text, false)
    }
    function ondisconnect () {
        if (comm != null) {
            usbVIdEl.innerText = usbPIdEl.innerText = btSvClIdEl.innerText = "<None>"
            usbVIdEl.style.color = usbPIdEl.style.color = btSvClIdEl.style.color = "darkgray"

            inputEl.disabled = signalBtn.disabled = signalEl.disabled = dtrSigEl.disabled = rtsSigEl.disabled = brkSigEl.disabled = readSignalBtn.disabled = true
            baudRateEl.disabled = dataBitsEl.disabled = flowControlEl.disabled = parityEl.disabled = stopBitsEl.disabled = false
            connectBtn.innerText = "Connect"
            comm = null

            log("<Device disconnected>")
        }
    }

    let lastLogCR = false
    function log (text, info = true, newline = info) {
        if (lastLogCR && text.startsWith("\n")) text = text.substring(1)
        lastLogCR = text.endsWith("\r")
        let el = document.createElement(info ? "i" : "span")

        el.innerText = text.replaceAll("\t", "\\t")
        outputEl.append(el)
        if (newline) outputEl.append(document.createElement("br"))

        if (autoscrollEl.checked) outputEl.scrollTop = outputEl.scrollHeight
    }
</script>
